<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00492A" />
    <meta name="color-scheme" content="only light" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/images/church/worship-lights.jpg" fetchpriority="high" />
    <!-- Fonts are self-hosted (see src/main.tsx) for speed and privacy -->

    <!-- Link preview + SEO tags are generated at build time from site.config.json (see vite.config.ts). Do not hard-code the domain here. -->
    <title>__PAGE_TITLE__</title>
    <meta name="description" content="__PAGE_DESC__" />
    <meta name="robots" content="__PAGE_ROBOTS__" />
    <link rel="canonical" href="__PAGE_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Saint Paul’s Baptist Church" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:title" content="__PAGE_OG_TITLE__" />
    <meta property="og:description" content="__PAGE_OG_DESC__" />
    <meta property="og:image" content="__PAGE_IMAGE__" />
    <meta property="og:image:secure_url" content="__PAGE_IMAGE__" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__PAGE_IMAGE_ALT__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__PAGE_OG_TITLE__" />
    <meta name="twitter:description" content="__PAGE_OG_DESC__" />
    <meta name="twitter:image" content="__PAGE_IMAGE__" />
    <meta name="twitter:image:alt" content="__PAGE_IMAGE_ALT__" />
    <!-- Structured data: helps Google show the church's address, phone and service time -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"Church","@id":"https://__SITE_HOST__/#church","name":"The Saint Paul's Baptist Church","alternateName":"Saint Paul's Baptist Church","url":"https://__SITE_HOST__/","logo":"https://__SITE_HOST__/icon-512.png","image":"https://__SITE_HOST__/og/home.png","telephone":"+1-804-643-4769","foundingDate":"1909","slogan":"A church for people on the GROW.","sameAs":["https://www.facebook.com/myspbc/","https://www.instagram.com/myspbc/","https://www.youtube.com/myspbc"],
         "address":{"@type":"PostalAddress","streetAddress":"4247 Creighton Road","addressLocality":"Henrico","addressRegion":"VA","postalCode":"23223","addressCountry":"US"},
         "subOrganization":[{"@type":"NGO","name":"Nia Community Development Corporation of Greater Richmond","taxID":"54-1736110"},{"@type":"NGO","name":"Saint Paul's Community Foundation","taxID":"20-4242064"}]},
        {"@type":"Church","name":"The Saint Paul's Baptist Church, Creighton Campus","parentOrganization":{"@id":"https://__SITE_HOST__/#church"},"telephone":"+1-804-643-4769","address":{"@type":"PostalAddress","streetAddress":"4247 Creighton Road","addressLocality":"Henrico","addressRegion":"VA","postalCode":"23223","addressCountry":"US"},"openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":"Sunday","opens":"09:00","closes":"11:00"}]},
        {"@type":"Church","name":"The Saint Paul's Baptist Church, Belt Campus","parentOrganization":{"@id":"https://__SITE_HOST__/#church"},"telephone":"+1-804-643-4769","address":{"@type":"PostalAddress","streetAddress":"700 E. Belt Boulevard","addressLocality":"Richmond","addressRegion":"VA","postalCode":"23224","addressCountry":"US"},"openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":"Sunday","opens":"11:30","closes":"13:30"}]}
      ]}
    </script>
    <!-- Netlify's hashed deploy addresses (e.g. 6a1f2c--site.netlify.app) always forward to the main address -->
    <script>(function(){var c='__SITE_HOST__',h=location.hostname;if(h!==c&&h.slice(-(c.length+2))==='--'+c&&h.indexOf('deploy-preview-')!==0){location.replace('https://'+c+location.pathname+location.search+location.hash)}})()</script>
  </head>
  <body>
    <!-- Hidden static forms so Netlify Forms detects every field at build time (names match src/config/site.ts formNames) -->
    <form name="spbc-contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="updates" />
      <input type="text" name="bot-field" />
    </form>
    <form name="spbc-prayer" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="text" name="email" />
      <input type="text" name="campus" />
      <input type="text" name="stage" />
      <textarea name="request"></textarea>
      <input type="text" name="private" />
      <input type="text" name="call" />
      <input type="text" name="bot-field" />
    </form>
    <form name="spbc-help" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="type" />
      <input type="text" name="need" />
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="text" name="email" />
      <input type="text" name="household" />
      <textarea name="details"></textarea>
      <input type="text" name="consent" />
      <input type="text" name="where" />
      <input type="text" name="forwhat" />
      <input type="text" name="bot-field" />
    </form>
    <form name="spbc-visit" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="type" />
      <input type="text" name="name" />
      <input type="text" name="campus" />
      <input type="text" name="date" />
      <input type="text" name="party" />
      <input type="text" name="phone" />
      <input type="text" name="email" />
      <input type="text" name="kids" />
      <textarea name="notes"></textarea>
      <input type="text" name="texts" />
      <input type="text" name="bot-field" />
    </form>
    <form name="spbc-volunteer" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="ministry" />
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="text" name="email" />
      <input type="text" name="campus" />
      <textarea name="message"></textarea>
      <input type="text" name="updates" />
      <input type="text" name="bot-field" />
    </form>
    <form name="spbc-guides" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="email" />
      <input type="text" name="guides" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
